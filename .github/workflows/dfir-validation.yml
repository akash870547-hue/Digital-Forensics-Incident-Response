name: DFIR Case Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile analysis scripts
        run: python -m py_compile scripts/*.py

      - name: Validate synthetic case
        run: python scripts/validate_case.py

      - name: Rebuild normalized timeline
        run: |
          python scripts/build_timeline.py             case-studies/windows-ransomware/evidence/windows-events.csv             case-studies/windows-ransomware/evidence/sysmon-events.csv

      - name: Verify generated timeline
        run: test -s case-studies/windows-ransomware/timeline/generated-timeline.csv

      - name: Run IOC extractor
        run: |
          python scripts/extract_iocs.py case-studies/windows-ransomware/evidence/ | tee /tmp/iocs.txt
          grep -q "203.0.113.77" /tmp/iocs.txt

      - name: Validate IOC JSON
        run: python -m json.tool case-studies/windows-ransomware/ioc/indicators.json >/dev/null
